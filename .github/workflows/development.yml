name: Deploy eede to GitHub Pages as dev
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: .
                  clean-exclude: |
                      pr-preview/
                      beta/
                  target-folder: main/
                  force: false
