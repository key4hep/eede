name: Deploy eede to GitHub Pages as prod
on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: .
                  clean-exclude: |
                      pr-preview/
                      main/
                  target-folder: release/
